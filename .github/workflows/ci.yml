name: CI

on:
  push:
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m venv .venv && .venv/bin/pip install -r protocol/requirements-dev.txt
      - run: .venv/bin/python -m pytest protocol/tests -q

  home-assistant-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m venv .venv && .venv/bin/pip install -r home-assistant/requirements-dev.txt
      - run: .venv/bin/python -m pytest home-assistant/tests -q

  integration-tests:
    # Parent-owned end-to-end test: runs the real Home Assistant add-on and
    # drives it over a real WebSocket using the *canonical* protocol codec
    # (not the add-on's vendored copy), proving the two independently-built
    # implementations actually agree on the wire — see
    # tests/integration/test_end_to_end.py for why this is distinct from
    # home-assistant/tests' own (self-consistent but not cross-checked) suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m venv .venv && .venv/bin/pip install -r tests/integration/requirements-dev.txt
      - run: .venv/bin/python -m pytest tests/integration -q

  esp32-host-tests:
    # Protocol-parsing logic is plain C++17 with no ESP-IDF dependency, so it
    # is compiled and tested directly on the runner instead of needing the
    # full ESP-IDF toolchain used for esp32-firmware-build below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd esp32/tests && cmake -B build && cmake --build build
      - run: cd esp32/tests && ctest --test-dir build --output-on-failure

  esp32-firmware-build:
    # Firmware targets ESP-IDF (not PlatformIO/Arduino); see docs/hardware.md
    # for the hardware/driver rationale and physical Wi-Fi/DMA acceptance test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v5.5, not v5.3: esp-hub75 0.3.6's ESP32-S3 GDMA backend uses
      # gdma_channel_alloc_config_t::isr_cache_safe and
      # gdma_strategy_config_t::eof_till_data_popped, which were added in
      # ESP-IDF v5.4. ESP-IDF v5.5 is the repository's tested baseline.
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: esp32

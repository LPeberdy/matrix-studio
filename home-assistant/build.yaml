# Base images Supervisor builds this add-on FROM, per architecture.
# Python 3.13 on Alpine 3.22: the current, actively rebuilt HA base image, and
# numpy / Pillow / aiohttp all publish cp313 musllinux_1_2 wheels for these
# architectures, so no compilation happens at build time.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-python:3.13-alpine3.22
  amd64: ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22
labels:
  org.opencontainers.image.title: Matrix Studio
  org.opencontainers.image.source: https://github.com/LPeberdy/matrix-studio
  org.opencontainers.image.licenses: MIT

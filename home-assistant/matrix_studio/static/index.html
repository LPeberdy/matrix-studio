<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Rewritten by web.py from the X-Ingress-Path header so every relative
         URL below resolves under Home Assistant's ingress proxy. -->
    <base href="{{BASE}}" />
    <title>Matrix Studio</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <header>
      <h1>Matrix Studio</h1>
      <span id="uptime" class="muted"></span>
    </header>

    <main>
      <section class="panel preview">
        <img id="preview" alt="Live 64x64 preview" width="256" height="256" />
        <p class="muted" id="preview-caption">preview (RGB565, as the panel sees it)</p>
      </section>

      <section class="panel">
        <h2>Status</h2>
        <dl id="status-list">
          <dt>Devices</dt><dd id="stat-devices">-</dd>
          <dt>Scene</dt><dd id="stat-scene">-</dd>
          <dt>FPS</dt><dd id="stat-fps">-</dd>
          <dt>Render</dt><dd id="stat-render">-</dd>
          <dt>Home Assistant</dt><dd id="stat-ha">-</dd>
          <dt>Endpoint</dt><dd id="stat-endpoint">-</dd>
        </dl>
        <div id="alerts"></div>
      </section>

      <section class="panel">
        <h2>Controls</h2>
        <label for="scene">Scene</label>
        <select id="scene"></select>

        <label for="brightness">Brightness <span id="brightness-value" class="muted"></span></label>
        <input id="brightness" type="range" min="0" max="255" step="1" />

        <div class="row">
          <button id="blank" type="button">Blank</button>
          <button id="reload" type="button">Reload scenes</button>
        </div>
        <p class="muted" id="scenes-dir"></p>
      </section>

      <section class="panel">
        <h2>Devices</h2>
        <table id="devices">
          <thead>
            <tr><th>Device</th><th>Address</th><th>Frames</th><th>RTT</th><th>Up</th></tr>
          </thead>
          <tbody><tr><td colspan="5" class="muted">no devices connected</td></tr></tbody>
        </table>
      </section>
    </main>

    <script src="static/app.js"></script>
  </body>
</html>
